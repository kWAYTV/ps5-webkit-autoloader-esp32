name: firmware

on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - host/**
      - pack/**
      - flasher/**
      - vendor/**
      - Makefile
      - install-deps.sh
      - .gitmodules
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - firmware/**
      - host/**
      - pack/**
      - flasher/**
      - vendor/**
      - Makefile
      - install-deps.sh
      - .gitmodules
      - .github/workflows/firmware.yml
  workflow_dispatch:

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout srbraboo payload
        uses: actions/checkout@v4
        with:
          repository: srbraboo/ps5-webkit-autoloader
          path: webkit-autoloader
          submodules: recursive

      - name: Install dependencies
        run: ./install-deps.sh

      - name: Build mklittlefs
        run: make -C vendor/mklittlefs

      - name: Record payload version
        run: |
          base=$(grep -E '#define[[:space:]]+WKAL_VERSION' webkit-autoloader/include/wkali.h | awk '{print $3}' | tr -d '"\r')
          sha=$(git -C webkit-autoloader rev-parse --short HEAD)
          echo "${base} (${sha})" | tee payload-version.txt

      - name: Pack srbraboo payload
        run: bash ./pack/pack_srbraboo.sh

      - name: Build firmware
        run: make

      - name: Upload merged bins
        uses: actions/upload-artifact@v4
        with:
          name: esp32-srbraboo-bins
          path: |
            build/pico/esp32-arduino.pico.merged.bin
            build/s2/esp32-arduino.s2.merged.bin
            build/s3/esp32-arduino.s3.merged.bin
            build/c3/esp32-arduino.c3.merged.bin
            payload-version.txt

  release:
    needs: firmware
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download bins
        uses: actions/download-artifact@v4
        with:
          name: esp32-srbraboo-bins
          path: bins

      - name: Publish latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          find bins -name '*.merged.bin' -exec cp -f {} release/ \;
          PAYLOAD="$(tr -d '[:space:]' < bins/payload-version.txt 2>/dev/null || echo unknown)"
          TITLE="srbraboo ${PAYLOAD}"
          NOTES="srbraboo/ps5-webkit-autoloader ${PAYLOAD}. Firmware ${GITHUB_SHA::12}. Rolling latest tag — each main build overwrites these bins. Flash at 0x0. S2: esp32-arduino.s2.merged.bin."
          ls -lh release
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit latest --repo "${{ github.repository }}" --title "$TITLE" --notes "$NOTES"
            gh release upload latest --repo "${{ github.repository }}" --clobber release/*.merged.bin
          else
            gh release create latest \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              release/*.merged.bin
          fi

  pages:
    needs: [firmware, release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Download bins
        uses: actions/download-artifact@v4
        with:
          name: esp32-srbraboo-bins
          path: bins

      - name: Stage Pages
        run: |
          mkdir -p flasher/firmware
          find bins -name '*.merged.bin' -exec cp -f {} flasher/firmware/ \;
          ls -lh flasher/firmware

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flasher

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
