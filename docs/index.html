<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#171717">
  <title>PS5 WebKit Autoloader</title>
  <style>
    :root {
      --bg: #171717;
      --fg: #f2f2f2;
      --dim: #8d8d8d;
      --line: #2c2c2c;
      --well: #101010;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
    body {
      font: 15px/1.55 ui-monospace, "Cascadia Mono", "Segoe UI Mono", "SF Mono", Consolas, monospace;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; }
    a:hover { text-decoration-thickness: 2px; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    .skip { position: absolute; left: -999px; top: 8px; }
    .skip:focus { left: 20px; background: var(--bg); padding: 4px 8px; z-index: 2; }
    header {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      max-width: 38rem; margin: 0 auto 28px;
    }
    .brand { font-size: 13px; text-decoration: none; color: var(--fg); }
    .brand:hover { text-decoration: underline; }
    .langs { display: flex; }
    .langs .act { min-height: 32px; padding: 0 10px; font-size: 12px; }
    .langs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
    nav { max-width: 38rem; margin: 0 auto 8px; }
    .track {
      display: flex; align-items: center; list-style: none; margin: 0; padding: 0;
    }
    .track li { display: contents; }
    .tick {
      appearance: none; min-width: 28px; min-height: 28px; padding: 0 6px;
      border: 1px solid var(--fg); background: transparent; color: var(--fg);
      font: inherit; font-size: 11px; font-variant-numeric: tabular-nums; cursor: pointer;
    }
    .tick[aria-current="step"] { background: var(--fg); color: var(--bg); }
    .tick:disabled { opacity: 0.35; cursor: not-allowed; }
    .rail { flex: 1; height: 1px; background: var(--line); min-width: 4px; }
    .caption {
      max-width: 38rem; margin: 0 auto 28px;
      display: flex; align-items: baseline; gap: 10px;
      color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
    }
    .caption b { color: var(--fg); font-weight: 600; }
    main { max-width: 38rem; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 600; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; }
    p { margin: 0 0 10px; color: var(--dim); }
    .lead { color: var(--fg); }
    strong, kbd, code { color: var(--fg); font-weight: 600; }
    kbd, code { font: inherit; border: 1px solid var(--line); padding: 0 5px; }
    .list {
      margin: 18px 0 0; padding: 0; list-style: none;
      display: grid; gap: 12px;
    }
    .list li {
      display: grid; grid-template-columns: 1.25rem 1fr; gap: 10px;
      color: var(--dim);
    }
    .list li > span:first-child {
      color: var(--fg); font-variant-numeric: tabular-nums;
    }
    .list p { margin: 0; }
    .note { margin-top: 18px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 28px 0 0; }
    .row-side { display: flex; flex-wrap: wrap; gap: 8px; }
    button.act, a.act {
      appearance: none; display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: 0 14px; border: 1px solid var(--fg);
      background: var(--fg); color: var(--bg); font: inherit; cursor: pointer;
      text-decoration: none;
    }
    button.act.ghost, a.act.ghost { background: transparent; color: var(--fg); }
    button.act:hover, a.act:hover { filter: brightness(1.08); }
    button.act:disabled { opacity: 0.35; cursor: not-allowed; filter: none; }
    .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 0; }
    .boards label {
      display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 12px;
      border: 1px solid var(--line); color: var(--fg); cursor: pointer;
    }
    .boards label:hover, .boards label:has(:focus-visible) { border-color: var(--fg); }
    .boards input { accent-color: var(--fg); }
    .device {
      margin: 18px 0 0; padding: 12px 14px;
      border: 1px solid var(--line); background: var(--well);
    }
    .device b { display: block; color: var(--fg); font-weight: 600; }
    .device span { display: block; margin-top: 4px; color: var(--dim); font-size: 13px; }
    .meter {
      display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: baseline;
      margin: 22px 0 12px;
    }
    .meter .bar { grid-column: 1 / -1; height: 2px; background: var(--line); }
    .bar > i { display: block; height: 100%; width: 0; background: var(--fg); }
    .pct { font-variant-numeric: tabular-nums; color: var(--fg); font-size: 13px; }
    .status { margin: 0; font-size: 13px; color: var(--dim); }
    .status:empty { display: none; }
    .status.ok, .status.bad { color: var(--fg); }
    .console { border: 1px solid var(--line); background: var(--well); }
    .console-hd {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 4px 0 12px; border-bottom: 1px solid var(--line);
    }
    .console-hd span { color: var(--dim); font-size: 12px; }
    .console-hd .act { min-height: 32px; padding: 0 10px; font-size: 12px; border: 0; }
    .log {
      margin: 0; height: 11rem; overflow: auto; padding: 12px;
      color: var(--dim); font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    footer { max-width: 38rem; margin: 48px auto 0; color: var(--dim); font-size: 12px; }
    footer a { color: var(--dim); }
    @media (max-width: 520px) {
      .boards { grid-template-columns: 1fr; }
      h1 { font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar > i { transition: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .bar > i { transition: width 80ms linear; }
      main { animation: in 140ms ease-out; }
    }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <footer>

    ·

  <script type="module">
    import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.7.0/bundle.js";

    const FILES = {
      "ESP32": "firmware/esp32-arduino.pico.merged.bin",

    };
    const CHIP_OF = { pico: "ESP32", s2: "ESP32-S2", s3: "ESP32-S3", c3: "ESP32-C3" };
    const LAST = 6;
    const CONNECT = 3;
    const WRITE = 4;

        n3: "Si la lista está vacía, vuelve atrás y entra otra vez en modo descarga. En este paso no se escribe el firmware.",

        write: "Escribir firmware",
        writing: "Escribiendo…",
        t5: "Únete a la placa en la PS5",
        p5: "La placa es ahora un punto de acceso Wi-Fi. La PS5 tiene que unirse a él.",
        s5: [
          "Desconecta la placa de este ordenador.",
          "Enchúfala a un puerto USB de la PS5.",
          "En la PS5, entra a la red Wi-Fi ESP32_PORTAL con la contraseña 12345678.",
          "Quédate en esa red. El aviso de “sin internet” es normal.",
        ],
        n5: "Relapse solo necesita la IP que asigna la placa. No hay internet, y no hace falta. Poops no necesita interfaz de red.",
        t6: "Abre la Guía del usuario",
        p6: "Mantén la PS5 en ESP32_PORTAL y no desconectes la placa.",
        s6: [
          "Ajustes → Guía y consejos → Guía del usuario.",
          "Espera a que la página termine de cargar.",
          "Debería abrirse Payload Manager. En Media aparece un acceso a WebKit Autoloader.",
        ],
        n6: "En siguientes arranques: Media → WebKit Autoloader. Sigue en ESP32_PORTAL.",
        n6b: "poops: 7.00–12.00. Relapse: 7.00–13.60 excepto 9.05 y 11.40.",
        idle: "",
        ready: "Listo.",
        fetch: "Cargando el archivo de firmware…",
        sync: "Esperando respuesta del chip…",
        chip: "Chip",
        using: "Imagen",
        mismatch: "El chip que respondió no es la placa que elegiste. Se escribe la imagen del chip conectado.",
        done: "Escritura terminada.",
        fail: "Falló. Mantén BOOT, vuelve a enchufar y elige el puerto.",
        abort: "No se eligió puerto.",
        noport: "No se eligió puerto.",
        native: "USB nativo. La placa no se puede resetear por este cable.",
        copy: "Copiar",
        copied: "Copiado",
        log: "Registro",
        badbin: "Falta el firmware o no es un binario. Espera a que el sitio termine de actualizar y recarga.",
      },
    };

    const state = {
      lang: "en",
      step: 0,
      board: "s2",
      flashed: false,
      connected: false,
      busy: false,
    };

    const session = {
      port: null,
      transport: null,
      loader: null,
      nativeUsb: false,
      chipName: "",
      imageKey: "",
    };

    const serialOk = typeof navigator !== "undefined" && "serial" in navigator;
    const stage = document.getElementById("stage");
    const track = document.getElementById("track");
    const caption = document.getElementById("caption");

    function t(key) {
      return I[state.lang][key];
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function readUrl() {
      const q = new URLSearchParams(location.search);
      const lang = q.get("lang") === "es" || (!q.get("lang") && /^es\b/i.test(navigator.language || "")) ? "es" : "en";
      let step = Math.min(LAST, Math.max(0, Number(q.get("step") || 0) || 0));
      const board = CHIP_OF[q.get("board")] ? q.get("board") : "s2";
      state.lang = lang;
      state.board = board;
      state.flashed = sessionStorage.getItem("flashed") === "1";
      if (step >= WRITE && !state.connected && !state.flashed) step = CONNECT;
      if (step > WRITE && !state.flashed) step = WRITE;
      state.step = step;
    }

    function writeUrl() {
      const q = new URLSearchParams();
      q.set("lang", state.lang);
      q.set("step", String(state.step));
      q.set("board", state.board);
      history.replaceState(null, "", `?${q}`);
    }

    function canOpen(n) {
      if (n <= state.step) return true;
      if (n !== state.step + 1) return false;
      if (state.step === 0) return serialOk;
      if (state.step === CONNECT) return state.connected;
      if (state.step === WRITE) return state.flashed;
      return true;
    }

    function setLang(lang) {
      if (state.busy) return;
      state.lang = lang;
      document.documentElement.lang = lang;
      writeUrl();
      render();
    }

    async function dropSession() {
      try { await session.transport?.disconnect(); } catch { /* already gone */ }
      session.port = null;
      session.transport = null;
      session.loader = null;
      session.nativeUsb = false;
      session.chipName = "";
      session.imageKey = "";
      state.connected = false;
    }

    function goto(n) {
      if (!canOpen(n) || state.busy) return;
      if (n < CONNECT) dropSession();
      state.step = n;
      writeUrl();
      render();
      stage.focus({ preventScroll: true });
    }

    function renderTrack() {
      const names = t("steps");
      track.replaceChildren();
      names.forEach((name, i) => {
        if (i) {
          const rail = document.createElement("span");
          rail.className = "rail";
          rail.setAttribute("aria-hidden", "true");
          track.append(rail);
        }
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tick";
        btn.textContent = String(i + 1);
        btn.title = name;
        btn.setAttribute("aria-label", `${i + 1}. ${name}`);
        if (i === state.step) btn.setAttribute("aria-current", "step");
        btn.disabled = !canOpen(i) || state.busy;
        btn.addEventListener("click", () => goto(i));
        li.append(btn);
        track.append(li);
      });
      caption.replaceChildren(
        document.createTextNode(`${state.step + 1} ${t("of")} ${names.length}`),
        document.createTextNode(" · "),
      );
      const bold = document.createElement("b");
      bold.textContent = names[state.step];
      caption.append(bold);
    }

    function navRow(opts = {}) {
      const { extra, next = true, nextLabel = t("next") } = opts;
      const row = document.createElement("div");
      row.className = "row";
      const left = document.createElement("div");
      left.className = "row-side";
      const right = document.createElement("div");
      right.className = "row-side";
      if (state.step > 0) {
        const back = document.createElement("button");
        back.type = "button";
        back.className = "act ghost";
        back.textContent = t("back");
        back.disabled = state.busy;
        back.addEventListener("click", () => goto(state.step - 1));
        left.append(back);
      }
      if (extra) right.append(extra);
      if (next && state.step < LAST) {
        const go = document.createElement("button");
        go.type = "button";
        go.className = "act";
        go.id = "next-btn";
        const ahead = t("steps")[state.step + 1];
        go.textContent = nextLabel === t("next") && ahead ? `${t("next")}: ${ahead}` : nextLabel;
        go.disabled = state.busy || (state.step === 0 && !serialOk);
        go.addEventListener("click", () => goto(state.step + 1));
        right.append(go);
      }
      if (state.step === LAST) {
        const again = document.createElement("button");
        again.type = "button";
        again.className = "act ghost";
        again.textContent = t("again");
        again.addEventListener("click", async () => {
          sessionStorage.removeItem("flashed");
          state.flashed = false;
          await dropSession();
          state.step = 0;
          writeUrl();
          render();
        });
        right.append(again);
      }
      row.append(left, right);
      return row;
    }

    function rich(text) {
      const p = document.createElement("p");
      p.innerHTML = text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("ESP32_PORTAL", "<code translate=\"no\">ESP32_PORTAL</code>")
        .replaceAll("12345678", "<code translate=\"no\">12345678</code>")
        .replaceAll("BOOT", "<kbd>BOOT</kbd>")
        .replaceAll("WebKit Autoloader", "<strong>WebKit Autoloader</strong>");
      return p;
    }

    function stepsList(items) {
      const ol = document.createElement("ol");
      ol.className = "list";
      items.forEach((text, i) => {
        const li = document.createElement("li");
        const n = document.createElement("span");
        n.textContent = String(i + 1);
        const body = rich(text);
        li.append(n, body);
        ol.append(li);
      });
      return ol;
    }

    function note(text) {
      const p = rich(text);
      p.classList.add("note");
      return p;
    }

    function deviceCard() {
      const box = document.createElement("div");
      box.className = "device";
      const name = document.createElement("b");
      name.textContent = session.chipName || CHIP_OF[state.board];
      const sub = document.createElement("span");
      sub.textContent = session.imageKey ? FILES[session.imageKey] : FILES[CHIP_OF[state.board]];
      box.append(name, sub);
      return box;
    }

    function consoleBox() {
      const box = document.createElement("div");
      box.className = "console";
      const hd = document.createElement("div");
      hd.className = "console-hd";
      const lab = document.createElement("span");
      lab.textContent = t("log");
      const copy = document.createElement("button");
      copy.type = "button";
      copy.className = "act ghost";
      copy.id = "copy-log";
      copy.textContent = t("copy");
      copy.addEventListener("click", copyLog);
      hd.append(lab, copy);
      const log = document.createElement("pre");
      log.className = "log";
      log.id = "log";
      log.setAttribute("aria-live", "polite");
      box.append(hd, log);
      return box;
    }

    function meterBox(statusText) {
      const meter = document.createElement("div");
      meter.className = "meter";
      meter.innerHTML =
        `<p class="status" id="flash-status">${statusText}</p>` +
        `<div class="pct" id="pct" aria-live="polite">0%</div>` +
        `<div class="bar" aria-hidden="true"><i id="bar"></i></div>`;
      return meter;
    }

    function renderStage() {
      const h = document.createElement("h1");
      h.textContent = t(`t${state.step}`);
      const frag = document.createDocumentFragment();
      frag.append(h);

      if (state.step === 0) {
        const lead = rich(t("p0"));
        lead.classList.add("lead");
        const s = document.createElement("p");
        s.className = "status " + (serialOk ? "ok" : "bad");
        s.textContent = serialOk ? t("ok0") : t("no0");
        frag.append(lead, s, navRow());
      }

      if (state.step === 1) {
        frag.append(rich(t("p1")));
        const box = document.createElement("div");
        box.className = "boards";
        box.setAttribute("role", "radiogroup");
        box.setAttribute("aria-label", t("t1"));
        for (const [id, chip] of Object.entries(CHIP_OF)) {
          const lab = document.createElement("label");
          const inp = document.createElement("input");
          inp.type = "radio";
          inp.name = "board";
          inp.value = id;
          inp.checked = state.board === id;
          inp.addEventListener("change", async () => {
            if (state.board !== id) await dropSession();
            state.board = id;
            writeUrl();
          });
          lab.append(inp, document.createTextNode(chip));
          box.append(lab);
        }
        frag.append(box, navRow());
      }

      if (state.step === 2) {
        frag.append(rich(t("p2")), stepsList(t("s2")), note(t("n2")), navRow());
      }

      if (state.step === CONNECT) {
        frag.append(rich(t("p3")), note(t("n3")));
        if (state.connected && session.chipName) frag.append(deviceCard());
        const st = document.createElement("p");
        st.className = "status";
        st.id = "flash-status";
        st.textContent = state.connected ? t("linked") : t("idle");
        const go = document.createElement("button");
        go.type = "button";
        go.className = "act";
        go.id = "flash-btn";
        go.textContent = state.connected ? t("reconnect") : t("connect");
        if (state.connected) go.classList.add("ghost");
        go.disabled = !serialOk || state.busy;
        go.addEventListener("click", () => connect(true));
        const extras = document.createDocumentFragment();
        extras.append(go);
        if (state.connected) {
          const cont = document.createElement("button");
          cont.type = "button";
          cont.className = "act";
          cont.textContent = `${t("next")}: ${t("steps")[WRITE]}`;
          cont.addEventListener("click", () => goto(WRITE));
          extras.append(cont);
        }
        frag.append(st, navRow({ extra: extras, next: false }));
      }

      if (state.step === WRITE) {
        frag.append(rich(t("p4")), note(t("n4")));
        if (session.chipName) frag.append(deviceCard());
        const go = document.createElement("button");
        go.type = "button";
        go.className = "act";
        go.id = "flash-btn";
        go.textContent = t("write");
        go.disabled = !serialOk || state.busy;
        go.addEventListener("click", writeFirmware);
        frag.append(meterBox(t("ready")), consoleBox(), navRow({ extra: go, next: false }));
      }

      if (state.step === 5) {
        frag.append(rich(t("p5")), stepsList(t("s5")), note(t("n5")), navRow());
      }

      if (state.step === LAST) {
        frag.append(rich(t("p6")), stepsList(t("s6")), note(t("n6")), note(t("n6b")), navRow({ next: false }));
      }

      stage.replaceChildren(frag);
    }

    function render() {
      document.querySelector("[data-i18n=skip]").textContent = t("skip");
      document.querySelector("[data-i18n=source]").textContent = t("source");
      document.querySelector("[data-i18n=bins]").textContent = t("bins");
      document.getElementById("stepnav").setAttribute("aria-label", t("stepsNav"));
      document.querySelectorAll("[data-set-lang]").forEach((b) => {
        b.setAttribute("aria-pressed", b.dataset.setLang === state.lang ? "true" : "false");
        b.disabled = state.busy;
      });
      renderTrack();
      renderStage();
    }

    function setBar(n) {
      const bar = document.getElementById("bar");
      const pct = document.getElementById("pct");
      if (!bar || !pct) return;
      const v = Math.max(0, Math.min(100, n));
      bar.style.width = v + "%";
      pct.textContent = Math.round(v) + "%";
    }

    function logLine(line) {
      const el = document.getElementById("log");
      if (!el) return;
      el.textContent += (el.textContent ? "\n" : "") + line;
      el.scrollTop = el.scrollHeight;
    }

    async function copyLog() {
      const el = document.getElementById("log");
      const btn = document.getElementById("copy-log");
      if (!el || !btn) return;
      try {
        await navigator.clipboard.writeText(el.textContent || "");
        btn.textContent = t("copied");
        setTimeout(() => { if (btn) btn.textContent = t("copy"); }, 1200);
      } catch {
        btn.textContent = t("fail");
      }
    }

    function ignoreMissingSignals(transport) {
      const wrap = (fn) => async function (...args) {
        try { return await fn.apply(this, args); }
        catch (err) {
          if (String(err).includes("control signals")) return;
          throw err;
        }
      };
      transport.setRTS = wrap(transport.setRTS);
      transport.setDTR = wrap(transport.setDTR);
      transport.setSignals = wrap(transport.setSignals);
    }

    async function loadFirmware(path, onProg) {
      const res = await fetch(`${path}?v=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`${path} (${res.status})`);
      onProg(10);
      const buf = new Uint8Array(await res.arrayBuffer());
      if (buf.length < 1024 || buf[0] === 0x3c) throw new Error(t("badbin"));
      onProg(40);
      return buf;
    }

    function setBusy(on, label) {
      state.busy = on;
      const btn = document.getElementById("flash-btn");
      if (btn) {
        btn.disabled = on || !serialOk;
        if (label) btn.textContent = label;
      }
      document.querySelectorAll("[data-set-lang]").forEach((b) => { b.disabled = on; });
      renderTrack();
    }

    function statusEl() {
      return document.getElementById("flash-status");
    }

    function setStatus(text, kind) {
      const st = statusEl();
      if (!st) return;
      st.className = "status" + (kind ? ` ${kind}` : "");
      st.textContent = text;
    }

    async function openPort() {
      try {
        return await navigator.serial.requestPort({
          filters: [
            { usbVendorId: 0x303a },
            { usbVendorId: 0x10c4 },
            { usbVendorId: 0x1a86 },
            { usbVendorId: 0x0403 },
          ],
        });
      } catch (err) {
        if (err?.name === "NotFoundError") throw Object.assign(new Error(t("noport")), { abort: true });
        throw err;
      }
    }

    async function openSession(force) {
      if (session.loader && !force) return;
      await dropSession();
      const port = await openPort();
      session.port = port;
      session.nativeUsb = port.getInfo().usbVendorId === 0x303a;
      session.transport = new Transport(port, false);
      ignoreMissingSignals(session.transport);
      session.loader = new ESPLoader({
        transport: session.transport,
        baudrate: 115200,
        romBaudrate: 115200,
        terminal: {
          clean() {},
          writeLine: (d) => {
            const s = String(d).replace(/\r/g, "").trimEnd();
            if (!s || /^Writing at 0x/i.test(s)) return;
            logLine(s);
          },
          write: (d) => {
            const s = String(d).replace(/\r/g, "").trim();
            if (!s || /^Writing at 0x/i.test(s)) return;
            logLine(s);
          },
        },
      });

      setStatus(t("sync"));
      if (session.nativeUsb) logLine(t("native"));
      let chip;
      try {
        chip = await session.loader.main(session.nativeUsb ? "no_reset" : "default_reset");
      } catch (err) {
        if (!String(err).includes("control signals")) throw err;
        logLine(t("native"));
        try { await session.transport.disconnect(); } catch { /* already closed */ }
        chip = await session.loader.main("no_reset");
      }
      const name = session.loader.chip?.CHIP_NAME || chip || CHIP_OF[state.board];
      session.chipName = name;
      session.imageKey = FILES[name] ? name : CHIP_OF[state.board];
      state.connected = true;
      logLine(`${t("chip")}: ${name}`);
      if (CHIP_OF[state.board] !== session.imageKey) logLine(t("mismatch"));
      logLine(`${t("using")}: ${FILES[session.imageKey]}`);
    }

    async function connect(force) {
      if (state.busy) return;
      setBusy(true, t("connecting"));
      setStatus(t("connecting"));
      try {
        await openSession(force);
        setStatus(t("linked"), "ok");
        setBusy(false, t("reconnect"));
        await sleep(700);
        state.step = WRITE;
        writeUrl();
        render();
        stage.focus({ preventScroll: true });
      } catch (err) {
        await dropSession();
        const aborted = err?.abort || err?.name === "NotFoundError";
        setStatus(aborted ? t("abort") : t("fail"), "bad");
        logLine(String(err?.message || err));
        setBusy(false, t("connect"));
      }
    }

    async function writeFirmware() {
      if (state.busy) return;
      const log = document.getElementById("log");
      if (log) log.textContent = "";
      setBar(0);
      setBusy(true, t("writing"));
      setStatus(t("sync"));
      try {
        if (!session.loader) {
          setStatus(t("connecting"));
          await openSession(false);
        }
        const path = FILES[session.imageKey];
        setStatus(t("fetch"));
        const data = await loadFirmware(path, setBar);
        logLine(`${data.byteLength} B`);
        setStatus(t("writing"));
        await session.loader.writeFlash({
          fileArray: [{ data: new Uint8Array(data), address: 0 }],
          flashSize: "4MB",
          flashMode: "keep",
          flashFreq: "keep",
          eraseAll: false,
          compress: false,
          reportProgress(_i, written, total) {
            setBar(40 + (written / total) * 60);
          },
        });
        try { await session.loader.after("no_reset"); } catch { /* S2 CDC cannot leave download mode over USB */ }
        setBar(100);
        state.flashed = true;
        sessionStorage.setItem("flashed", "1");
        setStatus(t("done"), "ok");
        logLine(t("done"));
        await dropSession();
        setBusy(false, t("write"));
        await sleep(800);
        state.step = 5;
        writeUrl();
        render();
        stage.focus({ preventScroll: true });
      } catch (err) {
        await dropSession();
        const aborted = err?.abort || err?.name === "NotFoundError";
        setStatus(aborted ? t("abort") : t("fail"), "bad");
        logLine(String(err?.message || err));
        setBusy(false, t("write"));
      }
    }

    document.querySelectorAll("[data-set-lang]").forEach((b) => {
      b.addEventListener("click", () => setLang(b.dataset.setLang));
    });
    window.addEventListener("popstate", () => { readUrl(); render(); });

    readUrl();
    writeUrl();
    render();
  </script>
</body>
</html>
